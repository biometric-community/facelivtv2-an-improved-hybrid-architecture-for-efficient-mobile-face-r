paper:
  slug: facelivtv2-an-improved-hybrid-architecture-for-efficient-mobile-face-r
  title: "FaceLiVTv2: An Improved Hybrid Architecture for Efficient Mobile Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: 1024
model:
  image_size: 112
  variant: xs
  embed_dim: 512
  cosface_s: 16.0
  cosface_m: 0.25
train:
  protocol: smoke
  seed: 42
  num_workers: 2
  batch_size: 32
  epochs: 1
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
eval:
  batch_size: 64
  max_lfw_pairs: 200
  max_calfw_pairs: 200
  max_cplfw_pairs: 200
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures/smoke
device: cuda
