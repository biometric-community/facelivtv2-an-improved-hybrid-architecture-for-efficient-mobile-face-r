paper:
  slug: facelivtv2-an-improved-hybrid-architecture-for-efficient-mobile-face-r
  title: "FaceLiVTv2: An Improved Hybrid Architecture for Efficient Mobile Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  variant: xs
  embed_dim: 512
  cosface_s: 16.0
  cosface_m: 0.25
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 128
  epochs: 12
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
eval:
  batch_size: 128
  max_lfw_pairs: null
  max_calfw_pairs: null
  max_cplfw_pairs: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
